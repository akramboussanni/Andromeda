name: Gather Releases

on:
  release:
    types: [published]

jobs:
  gather-assets:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: write # Needed to upload assets to the release
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest Andromeda.Installer and Andromeda.Mod Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "Downloading latest release of Andromeda.Installer..."
          gh release download --repo akramboussanni/Andromeda.Installer --dir installer_assets --pattern "*" || echo "No installer assets found or failed to download."
          
          echo "Downloading latest release of Andromeda.Mod..."
          gh release download "$RELEASE_TAG" --repo akramboussanni/Andromeda.Mod --dir mod_assets --pattern "Andromeda.Mod.dll"

          echo "Inspecting downloaded files..."
          ls -la installer_assets/ || true
          ls -la mod_assets/ || true

      - name: Verify mod version before uploading
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a semantic release tag.' }
          $expected = [Version]"$version.0"
          $dll = (Resolve-Path 'mod_assets/Andromeda.Mod.dll').Path
          $assemblyVersion = [Reflection.AssemblyName]::GetAssemblyName($dll).Version
          $fileVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($dll).FileVersion
          if ($assemblyVersion -ne $expected -or [Version]$fileVersion -ne $expected) {
            throw "Mod DLL version mismatch: assembly=$assemblyVersion file=$fileVersion expected=$expected"
          }

      - name: Upload Assets to Current Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "Uploading installer assets..."
          for file in installer_assets/*; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              gh release upload "$RELEASE_TAG" "$file" --clobber
            fi
          done
          
          echo "Uploading mod assets..."
          for file in mod_assets/*; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              gh release upload "$RELEASE_TAG" "$file" --clobber
            fi
          done
